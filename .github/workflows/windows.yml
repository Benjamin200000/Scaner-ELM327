name: Paquete Windows

# Arma el paquete portable y lo prueba en un Windows real: que las dos apps
# abran su ventana, que carguen los módulos nativos (puerto serie y J2534) y que el
# programa responda por HTTP y WebSocket contra el simulador.
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - 'windows/**'
      - 'desktop/**'
      - 'scripts/empaquetar-windows.mjs'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  paquete:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: agent
      - name: Armar el paquete
        run: node scripts/empaquetar-windows.mjs
      - name: Probar las dos apps (64 y 32 bits)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $puerto = 8790
          foreach ($v in '64bits', '32bits') {
            Write-Host "== $v"
            $exe = ".\release\ScanerELM327-$v\ScanerELM327.exe"

            # 1. Módulos nativos: puerto serie y carga de DLL (J2534)
            $env:SCANER_DIAGNOSTICO = "$PWD\diag-$v.txt"
            $d = Start-Process -FilePath $exe -PassThru -Wait
            Remove-Item Env:SCANER_DIAGNOSTICO
            Get-Content "diag-$v.txt"
            if ($d.ExitCode -ne 0) { throw "diagnóstico falló en $v" }

            # 2. La app abre su ventana, sirve el programa y habla con el simulador
            $env:SCANER_CAPTURA = "$PWD\ventana-$v.png"
            $p = Start-Process -FilePath $exe -ArgumentList '--simular', '--puerto', $puerto -PassThru
            Remove-Item Env:SCANER_CAPTURA
            try {
              Start-Sleep -Seconds 3
              $r = Invoke-WebRequest "http://127.0.0.1:$puerto/" -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
              node windows/humo.mjs $puerto
              if ($LASTEXITCODE -ne 0) { throw "humo falló en $v" }
              $p.WaitForExit(20000) | Out-Null
            } finally {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
            if (-not (Test-Path "ventana-$v.png")) { throw "la ventana de $v no llegó a dibujarse" }
            $puerto++
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScanerELM327-64bits
          path: release/ScanerELM327-64bits.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScanerELM327-32bits
          path: release/ScanerELM327-32bits.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            ventana-*.png
            diag-*.txt
